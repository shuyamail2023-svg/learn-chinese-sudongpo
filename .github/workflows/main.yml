name: Flutter Web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Get packages
        run: flutter pub get
      - name: Configure web
        run: flutter create . --platforms web
      - name: Build web
        run: flutter build web
      - name: Upload web app
        uses: actions/upload-artifact@v4
        with:
          name: learn-chinese-sudongpo-web
          path: build/web
